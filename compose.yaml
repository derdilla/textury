services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    cap_drop: [ALL]
    ports:
      - "3000:3000"
    volumes:
      - db-data:/appdata
    # Ensure bubblewrap works
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        root: ./

    ports:
      - "8001:8001"
    depends_on:
      - backend
volumes:
  db-data:
