<!DOCTYPE html>
<html>
<body>
<button id="login">Login</button>
<p id="name"></p>
<button id="get">Username</button>
<script>
document.getElementById('login').onclick=async() => {
  await fetch('/login/foo', {method: 'POST'})
  document.getElementById('name').innerText = await (await fetch('/login')).text()
};
document.getElementById('get').onclick=async() => {
  document.getElementById('name').innerText = await (await fetch('/login')).text()
};
</script>
<div style="height: 100px"></div>
<button id="addPrj">Add project</button>
<p id="list"></p>
<button id="getPrj">Get project idx</button>
<script>
    document.getElementById('addPrj').onclick=async() => {
        await fetch('/project/tset-foo_prj', {method: 'PUT'})
        document.getElementById('list').innerText = await (await fetch('/projects')).text()
    };
    document.getElementById('getPrj').onclick=async() => {
        document.getElementById('list').innerText = await (await fetch('/projects')).text()
    };
</script>
</body>
</html>
