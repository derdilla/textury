[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
axum = { version = "0.8.8", features = ["macros", "ws"] }
serde_json = "1.0.149"
time = "0.3.47"
serde = { version = "1.0.228", features = ["derive"] }
serde_valid = "2.0.1"
sea-orm = { version = "2.0.0-rc.36", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-time",
] }
tower-cookies = { version = "0.11.0", features = ["private"] }
regex = "1.12.3"
argon2 = "0.5.3"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
rand = "0.10.0"
yrs = { version = "0.23.0", features = ["sync", "weak"] }
futures-util = { version = "0.3.32", features = ["sink"] }
yrs-tokio = "0.1.0"
futures-core = "0.3.32"
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
bollard = { version = "0.20.1", default-features = false, features = ["pipe"] }
worker_api = { version = "0.1.0", path = "../worker_api" }
