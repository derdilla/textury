[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
axum = { version = "0.8.8", features = ["macros", "ws"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "time" ] }
tower-cookies = { version = "0.11.0", features = ["private"] }
regex = "1.12.3"
argon2 = "0.5.3"
rand = "0.10.0"
futures-util = { version = "0.3.32", features = ["sink"] }
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
base64 = "0.22.1"
async_zip = { version = "0.0.18", default-features = false, features = ["tokio", "tokio-fs", "deflate"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["io"] }
y-octo = { version = "0.0.2", features = ["events"] }
fireframe_sdk = { workspace = true, optional = true }
fireframe_protocol = { workspace = true, optional = true }
host_guest_protocol = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"] }
toml = { version = "1.1.6", default-features = false, features = ["serde", "parse"] }

[features]
default = []
fireframe = ["dep:fireframe_sdk", "dep:host_guest_protocol", "dep:fireframe_protocol"]
# Defaults to building for binary locations of archlinux host. Alternatives are:
alpine = []
macos = []

[lints]
workspace = true

[profile.dev.package.sqlx-macros]
opt-level = 3

[build-dependencies]
openapiv3 = "2.2.0"
schemars = "0.8.0"
serde_yaml = "0.9.34"
typify = "0.8.0"
