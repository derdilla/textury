<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeXtury</title>

    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Textury" />
    <meta name="theme-color" id="theme-color-meta" content="#f7ebed" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Sets color scheme directly so that the correct color is already shown during page reload.
      (function() {
        try {
          const savedTheme = localStorage.getItem('last-known-color-scheme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark);

          const themeColorMeta = document.getElementById('theme-color-meta');
          
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#171214');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#f7ebed');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      html.light, body.light {
        background-color: #f7ebed;
      }
      html.dark, body.dark {
        background-color: #171214;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
