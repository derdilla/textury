openapi: 3.0.3
info:
  title: Textury API
  version: 1.0.0
servers:
  - url: /api/v1

paths:
  /user:
    get:
      summary: Get current authenticated user
      responses:
        '401':
          description: Logged out
          content:
            text/plain:
              schema:
                type: string
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAccountInfo'
    post:
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '400':
          description: Bad request contents (e.g. name or password too short)
        '401':
          description: Invalid or expired registration token
          content:
            text/plain:
              schema:
                type: string
        '201':
          description: User created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAccountInfo'
    delete:
      summary: Delete the logged in user and potentially their projects
      description: If the user owns any projects, assign the ownership to another member. If the deleted user is the sole member delete the project and associated assets. If the user invited other users, they become invited by the account that invited the user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User deleted successfully
        '401':
          description: Logged out
          content:
            text/plain:
              schema:
                type: string
  /user/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '401':
          description: Invalid email or password
          content:
            text/plain:
              schema:
                type: string
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateAccountInfo'
  /user/logout:
    post:
      summary: Invalidate user session
      responses:
        '401':
          description: Not logged in
          content:
            text/plain:
              schema:
                type: string
        '200':
          description: Logged out
  /user/singleProjectUser:
    post:
      summary: Create a temporary user from a share that allows editing a single project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSingleProjectAccountRequest'
      responses:
        '401':
          description: Invalid email or password
          content:
            text/plain:
              schema:
                type: string
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSingleProjectAccountResponse'
  /user/username:
    put:
      summary: Change the logged in users username
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: The new name for this user
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Data updated successfully
  /user/email:
    put:
      summary: Change the logged in users email address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: The new email address for this user
        content:
          application/json:
            schema:
              type: string
              format: email
      responses:
        '200':
          description: Data updated successfully
        '409':
          description: There already exists an user with this email
          content:
            text/plain:
              schema:
                type: string
  /user/clientSettings:
    put:
      summary: Store client specific data for the logged in user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New settings the client wants to store on the server
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Data updated successfully
  /contacts:
     get:
      summary: Get information about other users the logged in user knows
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsList'
  /projects/index:
    get:
      summary: List projects visible to user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
  /projects/join:
    post:
      summary: Join project via token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinProjectRequest'
      responses:
        '200':
          description: Project joined
        '401':
          description: Invalid or expired token
          content:
            text/plain:
              schema:
                type: string
  /projects/preview:
    post:
      summary: Preview the project that a token would join to
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinProjectRequest'
      responses:
        '200':
          description: Preview available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinProjectPreview'
        '401':
          description: Invalid or expired token
  /projects/create:
    post:
      summary: Create project
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDetails'
      responses:
        '200':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectId'
        '401':
          description: Not allowed to create a project
  /project/{id}:
     delete:
      summary: Delete project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '401':
          description: Insufficient permissions
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: Project deleted
  /project/{id}/title:
    put:
      summary: Change the projects title
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      requestBody:
        required: true
        description: The new project title
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Project title updated successfully
  /project/{id}/share:
    post:
      summary: Create an invite token for a project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '404':
          description: Project doesn't exist or the requesting user has no access
          content:
            text/plain:
              schema:
                type: string
        '200':
          description: Join token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInvite'
  /project/{id}/publicShare:
    post:
      summary: Setup an multi-use named invite token for external users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicShareRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '404':
          description: Project doesn't exist or the requesting user is not the owner.
        '200':
          description: Join token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublicShareResponse'
    get:
      summary: Get information on public invite tokens
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '404':
          description: No share found or unauthorized
        '200':
          description: Pubic join credentials exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOwnerPublicShareInfo'
    delete:
      summary: Remove public share and associated accounts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '404':
          description: No share found or unauthorized
        '200':
          description: Pubic join credentials removed
  /project/{id}/edit:
    get:
      summary: Establish WebSocket connection for project editor
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '101':
          description: Switching Protocols to WebSocket
  /project/{id}/latestArtifact:
    get:
      summary: Fetch PDF output of the last compilation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: Latest compiled PDF
          content:
            'application/pdf':
              schema:
                type: string
                format: binary
  /project/{id}/meta:
    put:
      summary: Update project metadata for user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
             $ref: '#/components/schemas/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserMeta'
      responses:
        '200':
          description: Metadata updated
  /project/{id}/zip:
    get:
      summary: Download project files as ZIP
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compressed archive of project files
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="projectId.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /project/{id}/leave:
    post:
      summary: Permanently leave a project
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '404':
          description: Project doesn't exist or the requesting user has no access
        '409':
          description: The requesting user owns the project and needs to delete instead
        '200':
          description: Project left successfully
  /settings:
    get:
      summary: Get current server settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current server settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
  /settings/openSignUps:
    put:
      summary: Change openSignUps setting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: boolean
      responses:
        '200':
          description: Setting updated successfully
        '401':
          description: User is not an administrator
  /settings/userProjects:
    put:
      summary: Change userProjects setting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: boolean
      responses:
        '200':
          description: Setting updated successfully
        '401':
          description: User is not an administrator
  /settings/openSharing:
    put:
      summary: Change openSharing setting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: boolean
      responses:
        '200':
          description: Setting updated successfully
        '401':
          description: User is not an administrator
  /settings/maxCompileDuration:
    put:
      summary: Change maxCompileDuration setting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: integer
              minimum: 0
      responses:
        '200':
          description: Setting updated successfully
        '401':
          description: User is not an administrator
  /settings/maxCompileMemory:
    put:
      summary: Change maxCompileMemory setting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: integer
              minimum: 0
      responses:
        '200':
          description: Setting updated successfully
        '401':
          description: User is not an administrator
  /settings/maxProjectCount:
    put:
      summary: Change maxProjectCount setting
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: integer
              minimum: 0
      responses:
        '200':
          description: Setting updated successfully
        '401':
          description: User is not an administrator
  /settings/users:
    get:
      summary: Get list of all registered users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: User is not an administrator
  /settings/users/invite:
    post:
      summary: Generate invitation token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invite generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInvite'
  /settings/users/{id}:
    get:
      summary: Get details of a user interesting to administrators
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Detailed user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserInfo'
        '401':
          description: Requesting user is not an administrator
        '404':
          description: No user with this ID found
    delete:
      summary: Delete a user and potentially their projects
      description: If the user owns any projects, assign the ownership to another member. If the deleted user is the sole member delete the project and associated assets. If the user invited other users, they become invited by the account that invited the user.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: User deleted successfully
        '401':
          description: Requesting user is not an administrator or the other user is a more privileged administrator
        '404':
          description: No user with this ID found
  /settings/users/{id}/username:
    put:
      summary: Change username for user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Username changed successfully
        '401':
          description: Requesting user is not an administrator or the other user is a more privileged administrator
  /settings/users/{id}/email:
    put:
      summary: Change email setting
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: string
              format: email
      responses:
        '200':
          description: User email changed successfully
        '401':
          description: Requesting user is not an administrator or the other user is a more privileged administrator
        '409':
          description: There is another user with this email address
  /settings/users/{id}/isAdmin:
    put:
      summary: Change isAdmin setting
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        description: New value for this setting
        content:
          application/json:
            schema:
              type: boolean
      responses:
        '200':
          description: Administrator role updated successfully
        '401':
          description: Requesting user is not an administrator or the other user is already a more privileged administrator
  /_ws_types:
      get:
        summary: Types used for ws communication (Do not expose/implement this endpoint)
        responses:
          '200':
            description: Type references
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    clientMessage:
                      $ref: '#/components/schemas/WSClientMessage'
                    serverMessage:
                      $ref: '#/components/schemas/WSServerMessage'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserId:
      type: string
      pattern: '^u-[1-9A-HJ-NP-Za-km-z]{5}-[1-9A-HJ-NP-Za-km-z]{5}$'
    ProjectId:
      type: string
      pattern: '^p-[1-9A-HJ-NP-Za-km-z]{5}-[1-9A-HJ-NP-Za-km-z]{5}$'
    PrivateAccountInfo:
      type: object
      required:
        - id
        - username
        - email
        - isAdmin
        - settings
        - tiedToProject
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        username:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
        settings:
          type: object
          additionalProperties: true
        tiedToProject:
          type: boolean
    User:
      type: object
      description: Public information of a user
      required:
        - id
        - username
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        username:
          type: string
    AdminUserInfo:
      type: object
      required:
        - id
        - username
        - email
        - isAdmin
        - projects
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        username:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
        projects:
          description: Projects that user is member of
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
    ServerSettings:
      type: object
      required:
        - openSignUps
        - userProjects
        - openSharing
        - maxCompileDuration
        - maxCompileMemory
        - maxProjectCount
      properties:
        openSignUps:
          type: boolean
        userProjects:
          type: boolean
        openSharing:
          type: boolean
        maxCompileDuration:
          type: integer
          minimum: 0
        maxCompileMemory:
          type: integer
          minimum: 0
        maxProjectCount:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    CreateAccountRequest:
      type: object
      required:
        - username
        - email
        - password
        - registrationToken
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        registrationToken:
          type: string
    CreateSingleProjectAccountRequest:
      type: object
      required:
        - shareId
        - password
      properties:
        shareId:
          description: Human readable id identifying the project and share
          type: string
        password:
          type: string
          format: password
    CreateSingleProjectAccountResponse:
      type: object
      required:
        - userId
        - projectId
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        projectId:
          $ref: '#/components/schemas/ProjectId'
    CreatePublicShareRequest:
      type: object
      required:
        - shareId
        - sharePassword
      properties:
        shareId:
          description: Human readable id
          type: string
        sharePassword:
          description: Human readable password
          type: string
          format: password
    CreatePublicShareResponse:
      type: string
      enum:
        - ProjectNotFound
        - ProjectHasShare
        - ShareIdExists
        - IdTooShort
        - PasswordToShort
        - NotAllowedToShare
        - Success
    ProjectOwnerPublicShareInfo:
      type: object
      required:
        - shareId
        - sharePassword
        - signUpCount
      properties:
        shareId:
          description: Human readable id
          type: string
        sharePassword:
          description: Human readable password
          type: string
          format: password
        signUpCount:
          type: integer
    ContactsList:
      type: array
      items:
        $ref: '#/components/schemas/User'
    CreateProjectDetails:
      type: object
      required:
        - title
      properties:
        title:
          type: string
    ProjectSummary:
      type: object
      required:
        - id
        - title
        - owner
        - createdAt
        - updatedAt
        - updatedBy
        - members
        - metadata
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        title:
          type: string
        owner:
          $ref: '#/components/schemas/UserId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/UserId'
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        metadata:
          $ref: '#/components/schemas/UserMeta'
    UserMeta:
      description: User specific metadata for this project
      type: object
      additionalProperties: true
    UserInvite:
      type: object
      required:
        - registrationToken
        - expires
      properties:
        registrationToken:
          type: string
        expires:
          type: integer
          description: Minutes in which the token expires
    ProjectInvite:
      type: object
      required:
        - token
        - expires
      properties:
        token:
          type: string
        expires:
          type: integer
          description: Minutes in which the token expires
    JoinProjectRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    JoinProjectPreview:
      type: object
      required:
        - id
        - title
        - owner
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
        title:
          type: string
        owner:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Compiler:
      type: string
      enum:
      - PdfLatex
      - XeLatex
      - LuaLatex
      - Typst
    WSClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WSClientDocUpdate'
        - $ref: '#/components/schemas/WSClientAwareness'
        - $ref: '#/components/schemas/WSClientSetAsset'
        - $ref: '#/components/schemas/WSClientCompile'
      discriminator:
        propertyName: t
        mapping:
          u: '#/components/schemas/WSClientDocUpdate'
          a: '#/components/schemas/WSClientAwareness'
          setAsset: '#/components/schemas/WSClientSetAsset'
          compile: '#/components/schemas/WSClientCompile'
    WSClientDocUpdate:
      type: object
      required:
        - t
        - update
      properties:
        t:
          type: string
          enum: ['u']
        update:
          description: Base64 encoded yjs v1 update
          type: string
    WSClientAwareness:
      type: object
      required:
        - t
        - update
      properties:
        t:
          type: string
          enum: ['a']
        update:
          description: Base64 encoded y-awareness update
          type: string
    WSClientSetAsset:
      type: object
      required:
        - t
        - uuid
        - data
      properties:
        t:
          type: string
          enum: ['setAsset']
        uuid:
          type: string
        data:
          description: Base64 encoded content of the asset
          type: string
    WSClientCompile:
      type: object
      required:
        - t
        - uuid
        - compiler
      properties:
        t:
          type: string
          enum: ['compile']
        uuid:
          type: string
        compiler:
          $ref: '#/components/schemas/Compiler'

    WSServerMessage:
      oneOf:
        - $ref: '#/components/schemas/WSServerDocUpdate'
        - $ref: '#/components/schemas/WSServerAwareness'
        - $ref: '#/components/schemas/WSServerResetLog'
        - $ref: '#/components/schemas/WSServerLog'
