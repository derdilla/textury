[package]
name = "vsock_server"
description = "Runs on the guest with reduced privileges"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
nix = { workspace= true, features = ["process", "signal", "fs", "mount", "socket", "net" ] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "process", "rt-multi-thread", "fs", "time"] }
tokio-vsock = "0.7.2"
fireframe_sdk = { workspace = true }
host_guest_protocol = { workspace = true }
sanitize-filename = "0.6.0"

[lints]
workspace = true
